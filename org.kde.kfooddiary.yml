id: org.kde.kfooddiary
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: kfooddiary
finish-args:
  - '--socket=fallback-x11'
  - '--socket=wayland'
  - '--talk-name=org.freedesktop.portal.Desktop'
modules:
  - name: kfooddiary
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/aorliche/kfooddiary.git
        branch: main
