id: io.github.aorliche.antfood
runtime: org.kde.Platform
runtime-version: 6.11
sdk: org.kde.Sdk
command: antfood
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: antfood
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: .
